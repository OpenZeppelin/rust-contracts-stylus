[package]
name = "e2e"
description = "End-to-end testing of Stylus contracts on the Stylus SDK devnet"
version = "0.4.0"
publish = false
categories = ["development-tools::testing", "cryptography::cryptocurrencies"]
keywords = ["arbitrum", "ethereum", "stylus", "integration-testing", "tests"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alloy.workspace = true
tokio = { workspace = true, features = ["process", "signal"] }
eyre.workspace = true
e2e-proc.workspace = true
stylus-tools = { workspace = true, features = ["integration-tests"] }
toml = "0.8.13"

[[bin]]
name = "devnet"
path = "src/bin/devnet.rs"

[lints]
workspace = true
